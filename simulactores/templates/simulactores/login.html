<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Iniciar sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --granate: #B71C3C;
      --azul-petroleo: #0E2A3C;
    }
    body {
      background-color: var(--azul-petroleo);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card { max-width: 380px; width: 100%; border-radius: 12px; border: none; }
    .btn-granate { background-color: var(--granate); color: #fff; border: none; width: 100%; }
    .btn-granate:hover { background-color: #97162f; color: #fff; }
  </style>
</head>
<body>
  <div class="card login-card p-4">
    <h4 class="text-center mb-1" style="color: var(--azul-petroleo);">SimGest</h4>
    <p class="text-center text-muted small mb-4">Iniciar sesión</p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger py-2">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-granate mt-2">Ingresar</button>
    </form>
  </div>
</body>
</html>
