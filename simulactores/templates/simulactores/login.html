{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Iniciar sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'simulactores/css/estilos.css' %}" rel="stylesheet">
</head>

<body class="pagina-acceso">

  <div class="card tarjeta-acceso p-4 shadow">

    <h4 class="text-center mb-1" style="color: var(--azul-petroleo);">
      SimGest
    </h4>

    <p class="text-center text-muted small mb-4">
      Iniciar sesión
    </p>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-danger py-2">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">

      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">
          Correo electrónico
        </label>

        <input
          type="email"
          name="email"
          class="form-control"
          required
          autocomplete="email"
        >
      </div>

      <div class="mb-3">
        <label class="form-label">
          Contraseña
        </label>

        <div class="campo-password">
          <input
            type="password"
            name="password"
            id="id_password"
            class="form-control"
            required
            autocomplete="current-password"
          >
          <button type="button" class="btn-ojito" onclick="alternarPassword('id_password', this)">👁</button>
        </div>
      </div>

      <div class="text-end mb-3">
        <a href="{% url 'simulactores:password_reset' %}" class="small">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button type="submit" class="btn btn-granate btn-ancho">
        Ingresar
      </button>

    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      ¿No tienes cuenta?
      <a href="{% url 'simulactores:registro' %}">
        Regístrate aquí
      </a>
    </p>

  </div>

  <script src="{% static 'simulactores/js/ojito.js' %}"></script>

</body>
</html>
