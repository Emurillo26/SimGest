{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Recuperar contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'simulactores/css/estilos.css' %}" rel="stylesheet">
</head>

<body class="pagina-acceso">

  <div class="card tarjeta-acceso p-4 shadow">

    <h4 class="text-center mb-1" style="color: var(--azul-petroleo);">SimGest</h4>

    <p class="text-center text-muted small mb-4">
      Recuperar contraseña
    </p>

    <p class="text-muted small">
      Ingresa tu correo electrónico. Si existe una cuenta asociada,
      recibirás un enlace para restablecer tu contraseña.
    </p>

    <form method="post">

      {% csrf_token %}

      <div class="mb-3">
        <label for="id_email" class="form-label">
          Correo electrónico
        </label>

        <input
          type="email"
          name="email"
          id="id_email"
          class="form-control"
          required
          autocomplete="email"
        >
      </div>

      <button type="submit" class="btn btn-granate btn-ancho mt-2">
        Enviar enlace de recuperación
      </button>

    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      <a href="{% url 'simulactores:login' %}">
        Volver al inicio de sesión
      </a>
    </p>

  </div>

</body>
</html>
