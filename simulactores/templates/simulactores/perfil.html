<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Mi perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --granate: #B71C3C; --azul-petroleo: #0E2A3C; }
    body { background-color: #f4f6f8; }
    .sidebar { background-color: var(--azul-petroleo) !important; }
    .sidebar .nav-link.active { background-color: var(--granate); color: #fff !important; border-radius: 6px; }
    .topbar { background-color: #fff; border-bottom: 3px solid var(--granate); }
    .card { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 500px; }
    .btn-granate { background-color: var(--granate); color: #fff; border: none; }
    .btn-granate:hover { background-color: #97162f; color: #fff; }
  </style>
</head>
<body>
<div class="d-flex">
  <nav class="sidebar p-3" style="width:230px; min-height:100vh;">
    <div class="text-white fs-5 fw-bold mb-1">SimGest</div>
    <div class="text-white-50 small mb-4">Panel Administrador</div>
    <div class="nav flex-column gap-1">
      <a href="{% url 'simulactores:listado_usuarios' %}" class="nav-link text-white-50">Usuarios y accesos</a>
      <a href="{% url 'simulactores:perfil' %}" class="nav-link active">Mi perfil</a>
      <a href="{% url 'simulactores:logout' %}" class="nav-link text-white-50">Cerrar sesión</a>
    </div>
  </nav>
  <div class="flex-fill">
    <div class="topbar d-flex justify-content-between align-items-center p-3">
      <h4 class="m-0" style="color: var(--azul-petroleo);">Mi perfil</h4>
    </div>
    <div class="p-4">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success py-2">{{ message }}</div>
        {% endfor %}
      {% endif %}
      <div class="card p-4">
        <p class="text-muted small mb-1">Correo (no editable aquí)</p>
        <p class="fw-semibold mb-3">{{ usuario.email }}</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Teléfono</label>
            <input type="text" name="telefono" class="form-control" value="{{ usuario.telefono|default:'' }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="Dejar en blanco para no cambiarla">
          </div>
          <button type="submit" class="btn btn-granate">Guardar cambios</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
