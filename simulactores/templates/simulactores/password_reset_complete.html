{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>

  <title>SimGest - Contraseña actualizada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="{% static 'simulactores/css/estilos.css' %}" rel="stylesheet">
</head>

<body class="pagina-acceso">

  <div class="card tarjeta-acceso p-4 shadow">

    <h4 class="text-center mb-1" style="color: var(--azul-petroleo);">SimGest</h4>

    <a href="{% url 'simulactores:login' %}" class="btn btn-granate btn-ancho mt-2">

</html>
