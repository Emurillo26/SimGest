{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Contraseña actualizada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'simulactores/css/estilos.css' %}" rel="stylesheet">
</head>

<body class="auth-body">

  <main class="auth-fondo">
    <div class="auth-card">

      <!-- Panel izquierdo -->
      <section class="auth-panel">
        <div class="auth-marca">Sim<span class="gest">Gest</span></div>

        <div class="auth-texto">
          <h1>Todo listo.</h1>
          <p>Tu contraseña ya está actualizada. Puedes volver a entrar a tu cuenta.</p>
        </div>

        <svg class="auth-ecg" viewBox="0 0 520 64" aria-hidden="true" focusable="false">
          <path pathLength="100"
                d="M2 40 H140 L150 40 L160 6 L184 60 L196 26 L206 40 H352 L362 40 L372 24 L384 40 L392 46 L400 40 H518"/>
        </svg>
      </section>

      <!-- Contenido -->
      <section class="auth-lado">
        <div class="auth-icono ok" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5l4.5 4.5L19 7.5"/>
          </svg>
        </div>

        <h2 class="auth-titulo">Contraseña actualizada</h2>
        <p class="auth-sub">
          Tu contraseña fue restablecida correctamente.
          Ya puedes iniciar sesión con tu nueva contraseña.
        </p>

        <a href="{% url 'simulactores:login' %}" class="auth-boton">
          Iniciar sesión
        </a>
      </section>

    </div>
  </main>

</body>
</html>
