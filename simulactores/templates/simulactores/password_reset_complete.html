<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Contraseña actualizada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --granate: #B71C3C;
      --azul-petroleo: #0E2A3C;
    }

    body {
      background-color: var(--azul-petroleo);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-reset {
      max-width: 420px;
      width: 100%;
      border-radius: 12px;
      border: none;
    }

    .btn-granate {
      background-color: var(--granate);
      color: white;
      border: none;
      width: 100%;
    }

    .btn-granate:hover {
      background-color: #97162f;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card card-reset p-4 shadow">

    <h4
      class="text-center mb-1"
      style="color: var(--azul-petroleo);"
    >
      SimGest
    </h4>

    <p class="text-center text-muted small mb-4">
      Contraseña actualizada
    </p>

    <div class="alert alert-success">
      Tu contraseña fue restablecida correctamente.
    </div>

    <p class="text-muted small">
      Ya puedes iniciar sesión con tu nueva contraseña.
    </p>

    <a
      href="{% url 'simulactores:login' %}"
      class="btn btn-granate mt-2"
    >
      Iniciar sesión
    </a>

  </div>

</body>
</html>
