{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Solicitud no encontrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'simulactores/css/estilos.css' %}" rel="stylesheet">
</head>
<body class="auth-body">

  <main class="auth-fondo">
    <div class="auth-card">

      <section class="auth-panel">
        <div class="auth-marca">Sim<span class="gest">Gest</span></div>

        <div class="auth-texto">
          <h1>No la encontramos.</h1>
          <p>Revisa que el enlace sea correcto o vuelve a tus solicitudes.</p>
        </div>

        <svg class="auth-ecg" viewBox="0 0 520 64" aria-hidden="true" focusable="false"><path pathLength="100" d="M2 40 H140 L150 40 L160 6 L184 60 L196 26 L206 40 H352 L362 40 L372 24 L384 40 L392 46 L400 40 H518"/></svg>
      </section>

      <section class="auth-lado">
        <div class="auth-icono error" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </div>

        <h2 class="auth-titulo">Solicitud no encontrada</h2>
        <p class="auth-sub">Puede que el enlace sea incorrecto o que la solicitud ya no exista.</p>

        <a href="{% url 'simulactores:mis_solicitudes' %}" class="auth-boton">Volver a mis solicitudes</a>
      </section>

    </div>
  </main>

</body>
</html>
