{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Acceso denegado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'simulactores/css/estilos.css' %}" rel="stylesheet">
</head>
<body class="auth-body">

  <main class="auth-fondo">
    <div class="auth-card">

      <section class="auth-panel">
        <div class="auth-marca">Sim<span class="gest">Gest</span></div>

        <div class="auth-texto">
          <h1>Acceso restringido.</h1>
          <p>Tu rol no tiene permisos para entrar a este módulo.</p>
        </div>

        <svg class="auth-ecg" viewBox="0 0 520 64" aria-hidden="true" focusable="false"><path pathLength="100" d="M2 40 H140 L150 40 L160 6 L184 60 L196 26 L206 40 H352 L362 40 L372 24 L384 40 L392 46 L400 40 H518"/></svg>
      </section>

      <section class="auth-lado">
        <div class="auth-icono " aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </div>

        <h2 class="auth-titulo">Permisos insuficientes</h2>
        <p class="auth-sub">Tu rol no tiene acceso a este módulo del sistema. Si crees que esto es un error, contacta a un administrador.</p>

        <a href="{% url 'simulactores:login' %}" class="auth-boton">Volver al inicio de sesión</a>
      </section>

    </div>
  </main>

</body>
</html>
