<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SimGest - Acceso denegado</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --granate: #B71C3C; --azul-petroleo: #0E2A3C; }
    body { background-color: #f4f6f8; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border: none; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); max-width: 420px; }
    .btn-granate { background-color: var(--granate); color: #fff; border: none; }
    .btn-granate:hover { background-color: #97162f; color: #fff; }
  </style>
</head>
<body>
  <div class="card p-4 text-center">
    <div class="fs-1 mb-2">🔒</div>
    <h4 style="color: var(--azul-petroleo);">Permisos insuficientes</h4>
    <p class="text-muted">Tu rol no tiene acceso a este módulo del sistema. Si crees que esto es un error, contacta a un administrador.</p>
    <a href="{% url 'simulactores:login' %}" class="btn btn-granate mt-2">Volver al inicio de sesión</a>
  </div>
</body>
</html>
