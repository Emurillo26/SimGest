server {
    listen 80;
    server_name simulactorescr.com www.simulactorescr.com 179.66.143.35;

    client_max_body_size 10M;

    location /static/ {
        alias /var/www/simgest/app/staticfiles/;
        expires 7d;
        access_log off;
    }

    # Fotos de perfil que suben los usuarios (MEDIA_ROOT). Sin esto se suben pero no se ven.
    location /media/ {
        alias /var/www/simgest/app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
