<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SimGest - Nueva solicitud</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="../shared/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div class="d-flex">

  <nav class="bg-dark sidebar p-3" style="width:230px; min-height:100vh;">
    <div class="text-white fs-5 fw-bold mb-1">SimGest</div>
    <div class="text-white-50 small mb-3">Portal Cliente</div>
    <div class="nav flex-column">
      <a href="dashboard.html" class="nav-link text-white-50">Panel principal</a>
<a href="solicitudes.html" class="nav-link text-white-50">Mis solicitudes</a>
<a href="nueva-solicitud.html" class="nav-link active">Nueva solicitud</a>
<a href="perfil.html" class="nav-link text-white-50">Mi perfil</a>
    </div>
    <hr class="text-white-50">
    <div class="small text-white-50">Cambiar vista de demo:<br><a href="../admin/dashboard.html">Panel Administrador</a> | <a href="../actor/dashboard.html">Portal Actor</a></div>
  </nav>

  <div class="flex-fill">
    <div class="d-flex justify-content-between align-items-center border-bottom p-3">
      <h4 class="m-0">Nueva solicitud</h4>
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
          Maria Fernandez (Hospital San Jose)
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="perfil.html">Mi perfil</a></li>
          <li><a class="dropdown-item" href="../index.html">Cerrar sesion</a></li>
        </ul>
      </div>
    </div>

    <div class="p-4">
      
<div class="card" style="max-width:640px;">
  <div class="card-body">
    <form>
      <div class="mb-3">
        <label class="form-label">Tipo de simulacion</label>
        <select class="form-select">
          <option>Selecciona un tipo...</option>
          <option selected>Examen ECOE (Evaluacion Clinica Objetiva Estructurada)</option>
          <option>Manejo de Crisis (CRM)</option>
          <option>Comunicacion de Malas Noticias (Protocolo SPIKES)</option>
          <option>Seguridad del Paciente</option>
          <option>Simulacion corporativa</option>
        </select>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Fecha del evento</label>
          <input type="date" class="form-control is-invalid" value="2026-08-29">
          <div class="invalid-feedback">Esa fecha ya esta ocupada. Elige otra fecha.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Hora de inicio</label>
          <input type="time" class="form-control" value="08:00">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Cantidad de interpretes requeridos</label>
        <input type="number" class="form-control" value="2" min="1">
      </div>
      <div class="mb-3">
        <label class="form-label">Perfil deseado del actor (opcional)</label>
        <input type="text" class="form-control" placeholder="Ej. adulto mayor, sintomas cardiacos">
      </div>
      <div class="mb-3">
        <label class="form-label">Observaciones</label>
        <textarea class="form-control" rows="3" placeholder="Contexto adicional, sede, requisitos especiales..."></textarea>
      </div>
      <button type="button" class="btn btn-primary" onclick="alert('Solicitud registrada con estado Pendiente. Numero asignado: SIM-2026-0154')">Enviar solicitud</button>
      <a href="solicitudes.html" class="btn btn-outline-secondary">Cancelar</a>
    </form>
  </div>
</div>

    </div>
  </div>

</div>
<script src="../shared/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
